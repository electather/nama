services:
  nama:
    image: ${NAMA_IMAGE:-nama:local}
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TMPDIR: /run/nama
    ports:
      - "${NAMA_HOST_BIND:-127.0.0.1}:${NAMA_HOST_PORT-8080}:8080"
    volumes:
      - type: bind
        source: ${NAMA_CONFIG_PATH:-./nama.toml}
        target: /etc/nama/nama.toml
        read_only: true
    tmpfs:
      - /run/nama:rw,nosuid,nodev,noexec,uid=10001,gid=10001,mode=0700
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - --eval
        - >-
          const response = await fetch("http://127.0.0.1:8080/health/ready");
          if (response.status !== 200) process.exit(1);
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: nama
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_USER: nama
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --host 127.0.0.1 --username nama --dbname nama"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - nama-postgres:/var/lib/postgresql
    restart: unless-stopped

secrets:
  postgres_password:
    file: ${NAMA_POSTGRES_PASSWORD_FILE:-./secrets/postgres_password}

volumes:
  nama-postgres:
