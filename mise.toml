min_version = { hard = "2026.8.3" }

[tools]
buf = "1.72.0"
go = "1.26.5"
node = "24.19.0"
pnpm = "11.20.0"

[tasks.setup]
description = "Resolve dependencies from committed lock state"
run = [
  "pnpm install --frozen-lockfile",
  "go mod download",
  "git diff --exit-code -- go.mod go.sum",
  "DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer xcodebuild -resolvePackageDependencies -project apps/tvos/Nama.xcodeproj -scheme Nama -onlyUsePackageVersionsFromResolvedFile",
  "git diff --exit-code -- apps/tvos/Nama.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved",
]

[tasks.generate]
description = "Generate committed clients from Protobuf schemas"
run = "scripts/generate.sh"

[tasks.format]
description = "Format handwritten source files"
run = [
  "pnpm exec oxfmt .oxfmtrc.json .oxlintrc.json package.json tsconfig.base.json apps/server plugins/jellyfin gen/ts/package.json",
  "gofmt -w apps/cli gen/go",
  "DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer swift format format --in-place --recursive apps/tvos gen/swift/Package.swift",
]

[tasks."check:contracts"]
description = "Lint contracts and reject generated drift"
run = "scripts/check-contracts.sh"

[tasks."check:ts"]
description = "Check handwritten TypeScript"
run = "pnpm run check:ts"

[tasks."check:go"]
description = "Check Go formatting, vet, and tests"
run = "scripts/check-go.sh"

[tasks."check:swift"]
description = "Check Swift formatting, build the tvOS simulator target, and run focused tests from locked packages"
run = "scripts/check-swift.sh"

[tasks."check:tvos-fixtures"]
description = "Check the tvOS Player Lab fixture server"
run = "python3 apps/tvos/fixture_server_check.py"

[tasks."check:docker"]
description = "Validate the Docker Compose model"
run = "docker compose config --quiet"

[tasks.check]
description = "Run every repository check sequentially"
run = [
  { task = "check:contracts" },
  { task = "check:ts" },
  { task = "check:go" },
  { task = "check:swift" },
  { task = "check:docker" },
]
