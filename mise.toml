min_version = { hard = "2026.8.3" }

[tools]
buf = "1.72.0"
go = "1.26.5"
node = "24.19.0"
pnpm = "11.20.0"

[tasks.setup]
description = "Resolve dependencies from committed lock state"
run = [
  "pnpm install --frozen-lockfile",
  "go mod download",
  "git diff --exit-code -- go.mod go.sum",
  "DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer xcodebuild -resolvePackageDependencies -project apps/tvos/Nama.xcodeproj -scheme Nama -onlyUsePackageVersionsFromResolvedFile",
  "swift package resolve --package-path gen/swift",
  "git diff --exit-code -- apps/tvos/Nama.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved gen/swift/Package.resolved",
]

[tasks.generate]
description = "Generate committed clients from Protobuf schemas"
run = """
set -eu
repo_dir="$(pwd -P)"
repo_parent="$(dirname "$repo_dir")"
generation_dir="$(mktemp -d "$repo_parent/.nama-generate.XXXXXX")"
test -n "$generation_dir"
test -d "$generation_dir"
test ! -L "$generation_dir"
generation_dir="$(cd "$generation_dir" && pwd -P)"
test -n "$generation_dir"
test -d "$generation_dir"
test ! -L "$generation_dir"
test "$(dirname "$generation_dir")" = "$repo_parent"
case "$generation_dir" in
  "$repo_dir"|"$repo_dir"/*) exit 1 ;;
esac
for generated_leaf in gen/ts/src gen/go gen/swift/Sources/NamaAPI; do
  real_path="$repo_dir/$generated_leaf"
  case "$generation_dir" in
    "$real_path"|"$real_path"/*) exit 1 ;;
  esac
done

backup_root="$generation_dir/backups"
publish_complete=0
rollback_failed=0

restore_leaf() {
  generated_leaf="$1"
  real_path="$repo_dir/$generated_leaf"
  staged_path="$generation_dir/$generated_leaf"
  backup_path="$backup_root/$generated_leaf"

  if [ -d "$backup_path" ]; then
    if [ -d "$real_path" ] || [ -L "$real_path" ]; then
      if [ -d "$staged_path" ] || [ -L "$staged_path" ]; then
        rollback_failed=1
      elif ! mv "$real_path" "$staged_path"; then
        rollback_failed=1
      fi
    fi
    if [ ! -d "$real_path" ] && [ ! -L "$real_path" ]; then
      if ! mv "$backup_path" "$real_path"; then
        rollback_failed=1
      fi
    else
      rollback_failed=1
    fi
  fi
}

cleanup_generation() {
  exit_status=$?
  trap - EXIT
  trap '' HUP INT TERM
  if [ "$publish_complete" -ne 1 ]; then
    restore_leaf gen/swift/Sources/NamaAPI
    restore_leaf gen/go
    restore_leaf gen/ts/src
    if [ "$rollback_failed" -ne 0 ]; then
      printf '%s\n' "generated-output rollback failed; recovery data preserved at $generation_dir" >&2
      exit 1
    fi
  fi
  rm -rf -- "${generation_dir:?}"
  exit "$exit_status"
}

trap cleanup_generation EXIT
trap 'exit 129' HUP
trap 'exit 130' INT
trap 'exit 143' TERM

mkdir "$generation_dir/tmp"
test ! -L "$generation_dir/tmp"
test "$(cd "$generation_dir/tmp" && pwd -P)" = "$generation_dir/tmp"
TMPDIR="$generation_dir/tmp" buf generate --template buf.gen.yaml --output "$generation_dir"
TMPDIR="$generation_dir/tmp" buf generate --template buf.gen.googleapis.yaml --output "$generation_dir"

for generated_leaf in gen/ts/src gen/go gen/swift/Sources/NamaAPI; do
  staged_path="$generation_dir/$generated_leaf"
  test -d "$staged_path"
  test ! -L "$staged_path"
  test "$(cd "$staged_path" && pwd -P)" = "$staged_path"
  test -d "$generated_leaf"
  test ! -L "$generated_leaf"
  test "$(cd "$generated_leaf" && pwd -P)" = "$repo_dir/$generated_leaf"
done

mkdir -p "$backup_root/gen/ts" "$backup_root/gen/swift/Sources"
test -d "$backup_root"
test ! -L "$backup_root"
test "$(cd "$backup_root" && pwd -P)" = "$backup_root"

for generated_leaf in gen/ts/src gen/go gen/swift/Sources/NamaAPI; do
  mv "$repo_dir/$generated_leaf" "$backup_root/$generated_leaf"
  mv "$generation_dir/$generated_leaf" "$repo_dir/$generated_leaf"
done
publish_complete=1
"""

[tasks.format]
description = "Format handwritten source files"
run = [
  "pnpm exec oxfmt .oxfmtrc.json .oxlintrc.json package.json tsconfig.base.json apps/server plugins/jellyfin gen/ts/package.json",
  "gofmt -w apps/cli gen/go",
  "DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer swift format format --in-place --recursive apps/tvos gen/swift/Package.swift gen/swift/Tests",
]

[tasks."check:contracts"]
description = "Lint contracts and reject generated drift"
run = """
set -eu
repo_dir="$(pwd -P)"
repo_parent="$(dirname "$repo_dir")"
generation_dir="$(mktemp -d "$repo_parent/.nama-contracts.XXXXXX")"
test -n "$generation_dir"
test -d "$generation_dir"
test ! -L "$generation_dir"
generation_dir="$(cd "$generation_dir" && pwd -P)"
test -n "$generation_dir"
test -d "$generation_dir"
test ! -L "$generation_dir"
test "$(dirname "$generation_dir")" = "$repo_parent"
case "$generation_dir" in
  "$repo_dir"|"$repo_dir"/*) exit 1 ;;
esac
for generated_leaf in gen/ts/src gen/go gen/swift/Sources/NamaAPI; do
  real_path="$repo_dir/$generated_leaf"
  case "$generation_dir" in
    "$real_path"|"$real_path"/*) exit 1 ;;
  esac
done
trap 'rm -rf -- "${generation_dir:?}"' EXIT

mkdir "$generation_dir/tmp"
test ! -L "$generation_dir/tmp"
test "$(cd "$generation_dir/tmp" && pwd -P)" = "$generation_dir/tmp"
TMPDIR="$generation_dir/tmp" buf format --diff --exit-code
TMPDIR="$generation_dir/tmp" buf lint
TMPDIR="$generation_dir/tmp" buf build
TMPDIR="$generation_dir/tmp" buf generate --template buf.gen.yaml --output "$generation_dir"
TMPDIR="$generation_dir/tmp" buf generate --template buf.gen.googleapis.yaml --output "$generation_dir"

for generated_leaf in gen/ts/src gen/go gen/swift/Sources/NamaAPI; do
  staged_path="$generation_dir/$generated_leaf"
  test -d "$staged_path"
  test ! -L "$staged_path"
  test "$(cd "$staged_path" && pwd -P)" = "$staged_path"
  test -d "$generated_leaf"
  test ! -L "$generated_leaf"
  test "$(cd "$generated_leaf" && pwd -P)" = "$repo_dir/$generated_leaf"
done

diff -ru gen/ts/src "$generation_dir/gen/ts/src"
diff -ru gen/go "$generation_dir/gen/go"
diff -ru gen/swift/Sources/NamaAPI "$generation_dir/gen/swift/Sources/NamaAPI"
"""

[tasks."check:ts"]
description = "Check handwritten TypeScript"
run = "pnpm run check:ts"

[tasks."check:go"]
description = "Check Go formatting, vet, and tests"
run = """
set -eu
unformatted="$(gofmt -l apps/cli gen/go)"
if [ -n "$unformatted" ]; then
  printf '%s\n' "$unformatted"
  exit 1
fi
lock_state="$(cksum go.mod go.sum)"
go vet ./...
go test ./...
test "$lock_state" = "$(cksum go.mod go.sum)"
"""

[tasks."check:swift"]
description = "Check Swift formatting and build the tvOS simulator target from locked packages"
run = """
set -eu
export DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer
lock_state="$(cksum apps/tvos/Nama.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved gen/swift/Package.resolved)"
swift format lint --strict --recursive apps/tvos gen/swift/Package.swift gen/swift/Tests
swift test --package-path gen/swift
xcodebuild -project apps/tvos/Nama.xcodeproj -scheme Nama -destination 'generic/platform=tvOS Simulator' -derivedDataPath .derived-data -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile CODE_SIGNING_ALLOWED=NO build
test "$lock_state" = "$(cksum apps/tvos/Nama.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved gen/swift/Package.resolved)"
"""

[tasks."check:docker"]
description = "Validate the Docker Compose model"
run = "docker compose config --quiet"

[tasks.check]
description = "Run every repository check sequentially"
run = [
  { task = "check:contracts" },
  { task = "check:ts" },
  { task = "check:go" },
  { task = "check:swift" },
  { task = "check:docker" },
]
