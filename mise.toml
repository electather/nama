min_version = { hard = "2026.8.3" }

[tools]
buf = "1.72.0"
go = "1.26.5"
"go:golang.org/x/tools/gopls" = "0.23.0"
"go:honnef.co/go/tools/cmd/staticcheck" = "2026.1"
node = "24.19.0"
pnpm = "11.20.0"
prek = "0.4.13"
swiftlint = "0.65.1"

[tasks.setup]
description = "Resolve dependencies and install Git hooks"
run = [
  "pnpm install --frozen-lockfile",
  "go mod download",
  "git diff --exit-code -- go.mod go.sum",
  "prek install --hook-type pre-commit",
]

[tasks.generate]
description = "Generate committed clients from Protobuf schemas"
run = "scripts/generate.sh"

[tasks.format]
description = "Format handwritten source files"
run = [
  "pnpm exec oxfmt .oxfmtrc.json .oxlintrc.json package.json tsconfig.base.json apps/server/.fallowrc.json apps/server plugins/jellyfin gen/ts/package.json",
  "gofmt -w apps/cli gen/go",
  "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer swift format format --in-place gen/swift/Package.swift",
  "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer swift format format --in-place --recursive apps/ios/Nama apps/ios/NamaTests",
]

[tasks."check:contracts"]
description = "Lint contracts and reject generated drift"
run = "scripts/check-contracts.sh"

[tasks."check:ts"]
description = "Check TypeScript and auth-schema drift"
run = "pnpm run check:ts"

[tasks."check:go"]
description = "Check Go formatting, vet, tests, and Staticcheck"
run = "scripts/check-go.sh"

[tasks."check:ios"]
description = "Test and build the universal Apple application"
run = "scripts/check-ios.sh"
[tasks."check:swift"]
description = "Lint and type-analyze handwritten Swift with all compatible rules as errors"
run = "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer scripts/check-swift.sh"

[tasks."check:docker"]
description = "Verify the packaged application through Docker Compose"
run = "scripts/check-docker.sh"

[tasks.check]
description = "Run every repository check sequentially"
run = [
  { task = "check:contracts" },
  { task = "check:ts" },
  { task = "check:go" },
  { task = "check:ios" },
  { task = "check:swift" },
  { task = "check:docker" },
]
