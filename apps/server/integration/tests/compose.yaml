services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: nama
      POSTGRES_PASSWORD: nama
      POSTGRES_USER: nama
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username nama --dbname nama"]
      interval: 1s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1::5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  jellyfin:
    image: jellyfin/jellyfin:10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
    healthcheck:
      test:
        ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8096/System/Info/Public >/dev/null"]
      interval: 1s
      timeout: 5s
      retries: 60
      start_period: 30s
    ports:
      - "127.0.0.1::8096"
    volumes:
      - jellyfin-cache:/cache
      - jellyfin-config:/config

volumes:
  jellyfin-cache:
  jellyfin-config:
  postgres-data:
