syntax = "proto3";

package nama.plugin.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "nama/plugin/v1/common.proto";
import "nama/plugin/v1/media.proto";

enum ListConsistency {
  LIST_CONSISTENCY_UNSPECIFIED = 0;
  LIST_CONSISTENCY_BEST_EFFORT_SCAN = 1;
}

enum ArtworkAuthorizationScope {
  ARTWORK_AUTHORIZATION_SCOPE_UNSPECIFIED = 0;
  ARTWORK_AUTHORIZATION_SCOPE_PUBLIC = 1;
  ARTWORK_AUTHORIZATION_SCOPE_MEDIA_ITEM = 2;
  ARTWORK_AUTHORIZATION_SCOPE_PROVIDER_ACCOUNT = 3;
}

message BeginListItems {
  uint32 page_size = 1 [(buf.validate.field).uint32.lte = 100];
}

message ListItemsRequest {
  oneof scan {
    option (buf.validate.oneof).required = true;
    BeginListItems begin = 1;
    string continuation = 2 [
      (buf.validate.field).string.min_len = 1,
      (buf.validate.field).string.max_len = 4096
    ];
  }
}

message ListItemsResponse {
  repeated ProviderMediaItem items = 1 [(buf.validate.field).repeated.max_items = 100];
  optional string next_page_token = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 4096
  ];
  bool complete = 3;
  ListConsistency consistency = 4 [(buf.validate.field).enum = {
    not_in: [0]
  }];
}

message GetItemRequest {
  ProviderItemReference item_reference = 1 [(buf.validate.field).required = true];
}

message GetItemResponse {
  ProviderMediaItem item = 1 [(buf.validate.field).required = true];
}

message ResolveArtworkRequest {
  ProviderArtworkReference artwork_reference = 1 [(buf.validate.field).required = true];
  optional uint32 max_width = 2;
  optional uint32 max_height = 3;
}

message ProviderArtworkLease {
  string url = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 8192,
    (buf.validate.field).string.pattern = "^[Hh][Tt][Tt][Pp][Ss]?://",
    (buf.validate.field).string.uri = true
  ];
  repeated HttpHeader headers = 2 [(buf.validate.field).repeated.max_items = 32];
  repeated string allowed_redirect_origins = 3 [(buf.validate.field).repeated = {
    max_items: 16
    items: {
      string: {
        min_len: 1
        max_len: 8192
      }
    }
  }];
  google.protobuf.Timestamp access_expires_at = 4 [(buf.validate.field).timestamp = {}];
  string mime_type = 5 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
  ArtworkAuthorizationScope authorization_scope = 6 [(buf.validate.field).enum = {
    not_in: [0]
  }];
}

message ResolveArtworkResponse {
  ProviderArtworkLease lease = 1 [(buf.validate.field).required = true];
}

service LibraryService {
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse);
  rpc GetItem(GetItemRequest) returns (GetItemResponse);
  rpc ResolveArtwork(ResolveArtworkRequest) returns (ResolveArtworkResponse);
}
