syntax = "proto3";

package nama.api.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "nama/api/v1/common.proto";

enum PairingStatus {
  PAIRING_STATUS_UNSPECIFIED = 0;
  PAIRING_STATUS_PENDING = 1;
  PAIRING_STATUS_APPROVED = 2;
  PAIRING_STATUS_EXPIRED = 3;
}

message Device {
  string id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
  string display_name = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
  google.protobuf.Timestamp created_at = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).timestamp = {}
  ];
  optional google.protobuf.Timestamp last_seen_at = 4 [(buf.validate.field).timestamp = {}];
  bool revoked = 5;
  optional google.protobuf.Timestamp revoked_at = 6 [(buf.validate.field).timestamp = {}];
}

message BeginPairingRequest {
  string display_name = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
}

message BeginPairingResponse {
  string pairing_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
  string user_code = 2 [
    (buf.validate.field).string.min_len = 6,
    (buf.validate.field).string.max_len = 32
  ];
  string polling_token = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 4096
  ];
  google.protobuf.Timestamp expires_at = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).timestamp = {}
  ];
  google.protobuf.Duration poll_interval = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).duration.gt = {},
    (buf.validate.field).duration.lte = {seconds: 60}
  ];
}

message GetPairingStatusRequest {
  string pairing_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
  string polling_token = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 4096
  ];
}

message GetPairingStatusResponse {
  PairingStatus status = 1 [(buf.validate.field).enum = {
    not_in: [0]
  }];
  Device device = 2;
  BearerCredential credential = 3;
}

message ApprovePairingRequest {
  string operation_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
  string user_code = 2 [
    (buf.validate.field).string.min_len = 6,
    (buf.validate.field).string.max_len = 32
  ];
}

message ApprovePairingResponse {
  Device device = 1 [(buf.validate.field).required = true];
}

message ListDevicesRequest {
  uint32 page_size = 1 [(buf.validate.field).uint32.lte = 100];
  string page_token = 2 [(buf.validate.field).string.max_len = 4096];
}

message ListDevicesResponse {
  repeated Device devices = 1 [(buf.validate.field).repeated.max_items = 100];
  string next_page_token = 2 [(buf.validate.field).string.max_len = 4096];
}

message RevokeDeviceRequest {
  string device_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
}

message RevokeDeviceResponse {
  Device device = 1 [(buf.validate.field).required = true];
}

service DeviceService {
  rpc BeginPairing(BeginPairingRequest) returns (BeginPairingResponse);
  rpc GetPairingStatus(GetPairingStatusRequest) returns (GetPairingStatusResponse);
  rpc ApprovePairing(ApprovePairingRequest) returns (ApprovePairingResponse);
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  rpc RevokeDevice(RevokeDeviceRequest) returns (RevokeDeviceResponse);
}
