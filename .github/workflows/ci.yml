name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install locked tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3
          install: true
          cache: true
      - name: Resolve locked Node and Go dependencies
        run: |
          pnpm install --frozen-lockfile
          go mod download
          git diff --exit-code -- go.mod go.sum
      - name: Check contracts
        run: mise run check:contracts
      - name: Check TypeScript
        run: mise run check:ts
      - name: Check Go
        run: mise run check:go
      - name: Check Compose
        run: mise run check:docker


  buf-breaking:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install locked Buf
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3
          install: true
          install_args: buf
          cache: true
      - name: Fetch pull request base
        run: git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"
      - name: Reject breaking Protobuf changes
        run: buf breaking proto --against ".git#ref=refs/remotes/origin/${{ github.event.pull_request.base.ref }},subdir=proto"
