repos:
  - repo: local
    hooks:
      - id: swiftlint-ios
        name: SwiftLint handwritten Swift
        entry: mise run check:swift
        language: system
        pass_filenames: false
        files: ^(\.pre-commit-config\.yaml|\.swiftlint(-analyze)?\.yml|apps/ios/.*\.swift)$
        stages: [pre-commit]
      - id: fallow-server
        name: Fallow server changed-file audit
        entry: pnpm --filter @nama/server run audit:fallow
        language: system
        pass_filenames: false
        files: ^(apps/server/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|tsconfig\.base\.json$)
        stages: [pre-commit]
